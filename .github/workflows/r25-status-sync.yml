name: File 12 R25 Status Sync
on:
  push:
    branches:
      - review/file-12-r25-twenty-round-2026-08-29
    paths:
      - .github/workflows/r25-status-sync.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/file-12-r25-twenty-round-2026-08-29
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update status-only documentation
        run: |
          sed -i 's/Current repository candidate: `1.1.0-rc.3`/Current repository candidate: `1.1.0-rc.4`/' docs/FUTURE-24.md
          sed -i 's/repository review alignment through R24 on 13 August 2026/repository review alignment through R25 on 29 August 2026/' docs/FUTURE-24.md
          grep -F 'Current repository candidate: `1.1.0-rc.4`' docs/FUTURE-24.md
          grep -F 'repository review alignment through R25 on 29 August 2026' docs/FUTURE-24.md
      - name: Commit status sync
        run: |
          git config user.name 'Sabri File 12 Review Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/FUTURE-24.md
          git diff --cached --check
          git commit -m 'R25 round 20: align Future-24 current candidate status'
          git push origin HEAD:review/file-12-r25-twenty-round-2026-08-29
