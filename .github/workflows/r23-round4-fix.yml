name: R23 Round 4 Cover Safety State Hardening
on:
  push:
    branches:
      - review/file-12-r23-twenty-round-2026-08-13
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/file-12-r23-twenty-round-2026-08-13
          fetch-depth: 1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Apply complete Round 4 post-review defect batch and retest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pdf-library-foundation-12/includes/class-pldr-ingest.php')
          s=p.read_text()
          old="""        if(is_wp_error($cover_scan))return PLDR_Core::machine_error('pldr_cover_scan','The supplied cover failed the upload safety scan.',422,array('cause'=>$cover_scan->get_error_code()));
                  if('clean'!==($cover_scan['status']??'') && defined('PLDR_REQUIRE_MALWARE_SCANNER') && PLDR_REQUIRE_MALWARE_SCANNER)return PLDR_Core::machine_error('pldr_cover_scan_unavailable','A required malware scanner did not produce a clean cover result.',503,array('degraded'=>true));
          """
          new="""        if(is_wp_error($cover_scan))return PLDR_Core::machine_error('pldr_cover_scan','The supplied cover failed the upload safety scan.',422,array('cause'=>$cover_scan->get_error_code()));
                  if('clean'!==($cover_scan['status']??''))return PLDR_Core::machine_error('pldr_cover_scan_unavailable','The supplied cover cannot become an available derivative until the malware scanner produces a clean result.',503,array('degraded'=>true,'scan_status'=>sanitize_key((string)($cover_scan['status']??'unverified'))));
          """
          if 'cannot become an available derivative until the malware scanner produces a clean result' not in s:
              assert old in s
              s=s.replace(old,new,1)
          s=s.replace("'scan_status' => 'derived-cover'", "'scan_status' => 'clean'")
          p.write_text(s)
          PY
          rm -f .github/workflows/r23-round4-fix.yml
          php -l pdf-library-foundation-12/includes/class-pldr-ingest.php
          grep -q "cannot become an available derivative until the malware scanner produces a clean result" pdf-library-foundation-12/includes/class-pldr-ingest.php
          grep -q "'scan_status' => 'clean'" pdf-library-foundation-12/includes/class-pldr-ingest.php
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'R23 round 4: fail closed on unverified cover scan state'
          git push origin HEAD:review/file-12-r23-twenty-round-2026-08-13
