name: File 12 R25 Sequential Corrective Review

on:
  push:
    branches:
      - review/file-12-r25-twenty-round-2026-08-29
    paths:
      - 'r25-review-tools/**'
      - '.github/workflows/r25-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/file-12-r25-twenty-round-2026-08-29
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Freeze exact R24 product baseline
        run: git diff --exit-code b28dc3aead75920f15165f7c517f145424ae025f -- pdf-library-foundation-12
      - name: Validate R25 applier
        run: python -m py_compile r25-review-tools/apply.py
      - name: Configure sequential review commits
        run: |
          git config user.name "Sabri File 12 Review Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Apply proven defects only after their completed numbered reviews
        run: python r25-review-tools/apply.py
      - name: Full syntax verification after Round 19
        run: |
          find pdf-library-foundation-12 -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find pdf-library-foundation-12/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Push sequential R25 corrections
        run: git push origin HEAD:review/file-12-r25-twenty-round-2026-08-29
