name: R22 Fix Regression Assertions 3

on:
  push:
    branches:
      - review/file-12-r22-twenty-round-2026-08-13

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, 'R22 regression correction 3:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/file-12-r22-twenty-round-2026-08-13
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed corrections and verify R22 closure
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('pdf-library-foundation-12/includes/class-pldr-future-iiif.php')
          s = p.read_text()
          old = "PLDR_Core::machine_error('pldr_iiif_forbidden','IIIF manifest is unavailable for this document.',404)"
          new = "PLDR_Core::machine_error('pldr_future_iiif_unavailable','IIIF manifest is unavailable for this document.',404)"
          assert s.count(old) == 3, f'IIIF unavailable-state target drifted: {s.count(old)}'
          p.write_text(s.replace(old,new))

          p = Path('tests/test-twenty-round-review-r22.php')
          s = p.read_text()
          replacements = [
              (
                  '$must($ingest,"$cover_scan=self::scan_file",\'cover malware scan missing\');',
                  "$must($ingest,'$cover_scan=self::scan_file','cover malware scan missing');"
              ),
              (
                  "$must($shelves,'private const ITEM_LIMIT=5000','shelf lifetime bound missing');",
                  "$must($shelves,'ITEM_LIMIT = 5000','shelf lifetime bound missing');"
              ),
              (
                  '$must($readerJs,"matchMedia(\'(prefers-reduced-motion: reduce)\')",\'reduced-motion behavior missing from reader JS\');',
                  "$must($readerJs,'prefers-reduced-motion: reduce','reduced-motion behavior missing from reader JS');"
              ),
          ]
          for old, new in replacements:
              assert s.count(old) == 1, f'R22 assertion target drifted: {old}'
              s = s.replace(old,new)
          p.write_text(s)
          PY
          rm -f .github/workflows/r22-fix-iiif-test.yml .github/workflows/r22-fix-regression-2.yml .github/workflows/r22-fix-regression-3.yml
          php tests/test-twenty-round-review-r22.php
          find pdf-library-foundation-12 tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find pdf-library-foundation-12/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'R22: close IIIF and permanent regression QA defects'
          git push origin HEAD:review/file-12-r22-twenty-round-2026-08-13
