name: R22 Apply Product Patch

on:
  push:
    branches:
      - review/file-12-r22-twenty-round-2026-08-13

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'R22 transfer:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/file-12-r22-twenty-round-2026-08-13
          fetch-depth: 1
      - name: Decode and verify patch
        run: |
          cat .r22-transfer/product.patch.gz.b64.part00 .r22-transfer/product.patch.gz.b64.part01 .r22-transfer/product.patch.gz.b64.part02 .r22-transfer/product.patch.gz.b64.part03 | base64 -d | gzip -d > /tmp/r22-product.patch
          git apply --check /tmp/r22-product.patch
      - name: Apply R22 product corrections
        run: |
          git apply /tmp/r22-product.patch
          rm -rf .r22-transfer
          rm -f .github/workflows/r22-apply-product-patch.yml
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'R22: apply twenty-round corrective source closure'
          git push origin HEAD:review/file-12-r22-twenty-round-2026-08-13
