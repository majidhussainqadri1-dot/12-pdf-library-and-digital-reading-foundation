name: Bootstrap File 12 Source

on:
  push:
    branches:
      - codex/file-12-complete-1.0.0

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/file-12-complete-1.0.0

      - name: Restore source
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/chunk-*.b64 | base64 --decode > /tmp/file12.zip
          echo "0a2b815d353d30bbb532120f67a233dcaa8cebf1d38b57c7ffbd800cb090b0aa  /tmp/file12.zip" | sha256sum -c -
          rm -rf /tmp/file12-src
          mkdir -p /tmp/file12-src
          unzip -q /tmp/file12.zip -d /tmp/file12-src
          cp -a /tmp/file12-src/12-pdf-library-foundation/. .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete File 12 PDF Library implementation 1.0.0"
          git push origin HEAD:codex/file-12-complete-1.0.0
