name: Bootstrap File 12 Source

on:
  push:
    branches:
      - codex/file-12-complete-1.0.0

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/file-12-complete-1.0.0

      - name: Restore source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/file12-parts /tmp/file12-src
          mkdir -p /tmp/file12-parts /tmp/file12-src

          for f in bootstrap/chunk-*.b64; do
            name="$(basename "$f" .b64)"
            base64 --decode "$f" > "/tmp/file12-parts/${name}.bin"
            printf '%s ' "$name"
            wc -c < "/tmp/file12-parts/${name}.bin" | tr '\n' ' '
            sha256sum "/tmp/file12-parts/${name}.bin" | cut -d' ' -f1
          done

          expected07="051560a2db17e753eedc4aa06613442091bc1d56fa53388bc998e19246b0440f"
          expected17="cdc12a25cb6d9708a6f46a595fc4314e971f72e869e899984bfa653d3219f253"

          hash07="$(sha256sum /tmp/file12-parts/chunk-07.bin | cut -d' ' -f1)"
          if [ "$hash07" != "$expected07" ]; then
            head -c 6000 /tmp/file12-parts/chunk-07.bin > /tmp/file12-parts/chunk-07.fixed
            tail -c +6001 /tmp/file12-parts/chunk-07.bin > /tmp/file12-parts/chunk-07.tail
            echo "chunk-07 head $(sha256sum /tmp/file12-parts/chunk-07.fixed | cut -d' ' -f1)"
            echo "chunk-07 tail $(sha256sum /tmp/file12-parts/chunk-07.tail | cut -d' ' -f1)"
            echo "$expected07  /tmp/file12-parts/chunk-07.fixed" | sha256sum -c -
            mv /tmp/file12-parts/chunk-07.fixed /tmp/file12-parts/chunk-07.bin
          fi

          hash17="$(sha256sum /tmp/file12-parts/chunk-17.bin | cut -d' ' -f1)"
          if [ "$hash17" != "$expected17" ]; then
            if [ -f /tmp/file12-parts/chunk-07.tail ] && [ "$(sha256sum /tmp/file12-parts/chunk-07.tail | cut -d' ' -f1)" = "$expected17" ]; then
              cp /tmp/file12-parts/chunk-07.tail /tmp/file12-parts/chunk-17.bin
            else
              echo "No valid chunk-17 recovery candidate" >&2
              exit 1
            fi
          fi

          : > /tmp/file12.zip
          for n in $(seq -w 1 19); do
            cat "/tmp/file12-parts/chunk-${n}.bin" >> /tmp/file12.zip
          done
          echo "0a2b815d353d30bbb532120f67a233dcaa8cebf1d38b57c7ffbd800cb090b0aa  /tmp/file12.zip" | sha256sum -c -

          unzip -q /tmp/file12.zip -d /tmp/file12-src
          cp -a /tmp/file12-src/12-pdf-library-foundation/. .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete File 12 PDF Library implementation 1.0.0"
          git push origin HEAD:codex/file-12-complete-1.0.0
