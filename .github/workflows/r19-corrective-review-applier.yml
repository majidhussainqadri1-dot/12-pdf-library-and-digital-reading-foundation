name: File 12 R19 Sequential Corrective Review Applier

on:
  push:
    branches:
      - feat/file-12-future-24-v1.1.0-rc1
    paths:
      - 'r19-review-tools/**'
      - '.github/workflows/r19-corrective-review-applier.yml'

permissions:
  contents: write

jobs:
  apply-r19:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/file-12-future-24-v1.1.0-rc1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Freeze R18 product baseline
        run: |
          git diff --exit-code 264ca1fb80377f734e12b6afcae5d5b05fb80ce4 -- pdf-library-foundation-12
      - name: Validate review tooling
        run: python -m py_compile r19-review-tools/part1.py r19-review-tools/part2.py r19-review-tools/part3.py r19-review-tools/part4.py
      - name: Configure review commits
        run: |
          git config user.name "Sabri File 12 Review Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: R19 rounds 1 to 5
        run: python r19-review-tools/part1.py
      - name: R19 rounds 6 to 10
        run: python r19-review-tools/part2.py
      - name: R19 rounds 11 to 15
        run: python r19-review-tools/part3.py
      - name: R19 rounds 16 to 20
        run: python r19-review-tools/part4.py
      - name: Full syntax verification after Round 20
        run: |
          find pdf-library-foundation-12 -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find pdf-library-foundation-12/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Push sequential R19 corrections
        run: git push origin HEAD:feat/file-12-future-24-v1.1.0-rc1
