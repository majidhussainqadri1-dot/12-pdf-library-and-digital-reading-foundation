name: R16 Corrective Review Patch Applier

on:
  push:
    branches:
      - feat/file-12-future-24-v1.1.0-rc1
    paths:
      - .github/workflows/r16-patch-applier.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/file-12-future-24-v1.1.0-rc1
          fetch-depth: 0
      - name: Decode exact reviewed R16 patch chunks
        run: |
          python - <<'PY'
          import base64, zlib
          from pathlib import Path
          chunks = sorted(Path('r16-chunks').glob('*.txt'))
          if len(chunks) != 7:
              raise SystemExit(f'expected 7 R16 chunks, found {len(chunks)}')
          payload = ''.join(p.read_text() for p in chunks)
          patch = zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          patch = patch.replace('a/assets/', 'a/pdf-library-foundation-12/assets/')
          patch = patch.replace('b/assets/', 'b/pdf-library-foundation-12/assets/')
          patch = patch.replace('a/includes/', 'a/pdf-library-foundation-12/includes/')
          patch = patch.replace('b/includes/', 'b/pdf-library-foundation-12/includes/')
          Path('/tmp/r16.patch').write_text(patch)
          PY
      - name: Apply reviewed R16 corrections
        run: |
          set -euo pipefail
          git apply --check /tmp/r16.patch
          git apply /tmp/r16.patch
          find pdf-library-foundation-12 -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find pdf-library-foundation-12/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          php tests/test-twenty-round-review-r16.php
      - name: Commit exact reviewed R16 source state
        run: |
          set -euo pipefail
          git rm -r r16-review.patch.zlib.b64 r16-chunks
          git add pdf-library-foundation-12 docs tests
          git config user.name 'Sabri File 12 R16 Corrective Review'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Apply File 12 R16 twenty-round corrective review source'
          git push origin HEAD:feat/file-12-future-24-v1.1.0-rc1
