name: R23 Round 15 Offline Vault Logout Purge
on:
  push:
    branches:
      - review/file-12-r23-twenty-round-2026-08-13
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/file-12-r23-twenty-round-2026-08-13
          fetch-depth: 1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Apply complete Round 15 post-review defect batch and retest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main=Path('pdf-library-foundation-12/pdf-library-digital-reading.php')
          s=main.read_text()
          old="""    add_action('wp_logout', array('PLDR_Future', 'mark_vault_purge'));
              add_action('wp_enqueue_scripts', array('PLDR_Future', 'vault_purge_asset'), 2);
          """
          new="""    add_action('wp_logout', array('PLDR_Future', 'mark_vault_purge'));
              add_action('wp_enqueue_scripts', array('PLDR_Future', 'vault_purge_asset'), 2);
              add_action('login_enqueue_scripts', array('PLDR_Future', 'vault_purge_asset'), 2);
          """
          if "login_enqueue_scripts', array('PLDR_Future', 'vault_purge_asset')" not in s:
              assert old in s
              s=s.replace(old,new,1)
          main.write_text(s)

          p=Path('pdf-library-foundation-12/includes/class-pldr-future.php')
          s=p.read_text()
          s=s.replace("        add_action('wp_logout', array(__CLASS__, 'mark_vault_purge'));\n        add_action('wp_enqueue_scripts', array(__CLASS__, 'vault_purge_asset'), 2);\n",'')
          p.write_text(s)
          PY
          rm -f .github/workflows/r23-round15-fix.yml
          php -l pdf-library-foundation-12/pdf-library-digital-reading.php
          php -l pdf-library-foundation-12/includes/class-pldr-future.php
          grep -q "login_enqueue_scripts.*vault_purge_asset" pdf-library-foundation-12/pdf-library-digital-reading.php
          test "$(grep -R "add_action('wp_logout'.*mark_vault_purge" -n pdf-library-foundation-12 --include='*.php' | wc -l)" -eq 1
          test "$(grep -R "add_action('wp_enqueue_scripts'.*vault_purge_asset" -n pdf-library-foundation-12 --include='*.php' | wc -l)" -eq 1
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'R23 round 15: purge encrypted offline vault on logout login surface'
          git push origin HEAD:review/file-12-r23-twenty-round-2026-08-13
