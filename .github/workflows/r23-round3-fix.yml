name: R23 Round 3 Signed Delivery Hardening
on:
  push:
    branches:
      - review/file-12-r23-twenty-round-2026-08-13
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/file-12-r23-twenty-round-2026-08-13
          fetch-depth: 1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Apply complete Round 3 post-review defect batch and retest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pdf-library-foundation-12/includes/class-pldr-access.php')
          s=p.read_text()
          old="""        $size = (int) $object['byte_size'];
                  if ($size < 1) self::fail_delivery(503, 'Document object has an invalid byte size.');
                  [$start, $end, $partial] = self::parse_range($size);
                  $method = strtoupper((string) ($_SERVER['REQUEST_METHOD'] ?? 'GET'));
                  if ('HEAD' !== $method) {
          """
          new="""        $size = (int) $object['byte_size'];
                  if ($size < 1) self::fail_delivery(503, 'Document object has an invalid byte size.');
                  $method = strtoupper((string) ($_SERVER['REQUEST_METHOD'] ?? 'GET'));
                  if (!in_array($method, array('GET','HEAD'), true)) {
                      header('Allow: GET, HEAD');
                      self::fail_delivery(405, 'Only GET and HEAD are supported for signed document delivery.');
                  }
                  [$start, $end, $partial] = self::parse_range($size);
                  if ('HEAD' !== $method) {
          """
          if 'Only GET and HEAD are supported for signed document delivery.' not in s:
              assert old in s
              s=s.replace(old,new,1)
          old2="""        if ('' === $m[1]) {
                      $suffix = min($size, max(1, (int) $m[2]));
                      return array($size - $suffix, $size - 1, true);
                  }
          """
          new2="""        if ('' === $m[1]) {
                      $requested_suffix = (int) $m[2];
                      if ($requested_suffix < 1) self::fail_delivery(416, 'Requested byte-range suffix is unsatisfiable.');
                      $suffix = min($size, $requested_suffix);
                      return array($size - $suffix, $size - 1, true);
                  }
          """
          if 'requested_suffix' not in s:
              assert old2 in s
              s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          rm -f .github/workflows/r23-round3-fix.yml
          php -l pdf-library-foundation-12/includes/class-pldr-access.php
          grep -q "Allow: GET, HEAD" pdf-library-foundation-12/includes/class-pldr-access.php
          grep -q "requested_suffix < 1" pdf-library-foundation-12/includes/class-pldr-access.php
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'R23 round 3: harden signed delivery method and range semantics'
          git push origin HEAD:review/file-12-r23-twenty-round-2026-08-13
