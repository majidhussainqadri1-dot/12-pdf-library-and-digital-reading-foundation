name: File 12 R24 Apply Reviewed Corrective Batch

on:
  push:
    branches:
      - review/file-12-r24-twenty-round-2026-08-13

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/file-12-r24-twenty-round-2026-08-13
          fetch-depth: 1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply complete R24 post-review corrective batches and verify
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r24-parts.sha256 <<'EOF'
          afdc93975cc9018488e6688393ff5ade655507ca949c5a919871a626568e5ab9  r24-patch/part00.b64
          6c4e0ecc15ce36557271b7760576dc602718b480d15f5d65bf05e8a7f1de54ae  r24-patch/part01.b64
          3ae546b0f5ced43ef2ac39723934ffb3208f56a2de0b193f997f97bb0c1498f6  r24-patch/part02.b64
          ea91f389d6296f7fb9e9f1da5a26e64f145a306b7bc5fd19d62542f291ba2bf2  r24-patch/part03.b64
          56316944bb46373448d5f76bb74cc00f1753fd9fa535b11403b137cecc3b545f  r24-patch/part04.b64
          9870ceee13fd52b1582e3e85f3c2ee56b041744fe619e006bddd41dcdbf78f6b  r24-patch/part05.b64
          8d34cad6ab478654ef5076f257e921ce22f7a683d450774740914b62bf6f5048  r24-patch/part06.b64
          f9059f5c1c62fa6486b77e572de7564900f2750aa5d31cbf3511a564b4596648  r24-patch/part07.b64
          EOF
          sha256sum -c /tmp/r24-parts.sha256
          cat r24-patch/part*.b64 | base64 -d > /tmp/r24_repo_patch.tar.gz
          tar -xzf /tmp/r24_repo_patch.tar.gz -C .
          rm -rf r24-patch
          sed -i 's/[[:space:]]\+$//' MANIFEST.md

          # R24 changed canonical internals while preserving the older guarantees.
          # Retained static tests follow the canonical implementation, not retired source locations/text.
          python3 - <<'PY'
          from pathlib import Path

          p=Path('tests/test-ten-round-review-r3.php')
          s=p.read_text()
          s=s.replace("$rights = $read('includes/class-pldr-rights.php');\n", "$rights = $read('includes/class-pldr-rights.php');\n$outbox = $read('includes/class-pldr-r21-outbox.php');\n", 1)
          s=s.replace("$must($rights, '$lease_until=gmdate', 'Outbox dispatch lease missing.');", "$must($outbox, '$lease_until=gmdate', 'Outbox dispatch lease missing.');")
          s=s.replace("$must($rights, \"'processing',\\$lease_until\", 'Outbox processing claim missing.');", "$must($outbox, \"'processing',\\$lease_until\", 'Outbox processing claim missing.');")
          s=s.replace("$must($rights, 'if(1!==$claimed)continue;', 'Outbox dispatch does not require a successful claim.');", "$must($outbox, 'if(1!==$claimed)continue;', 'Outbox dispatch does not require a successful claim.');")
          s=s.replace("$must($reader, '$logical_offset=$cursor_token?0:(($page-1)*$per_page);', 'Logical access-filtered pagination offset/cursor compatibility missing.');", "$must($reader, 'cursor_skip_remaining', 'Logical access-filtered pagination offset/cursor compatibility missing.');")
          p.write_text(s)

          p=Path('tests/test-twenty-round-review-r18.php')
          s=p.read_text()
          s=s.replace("$rights=$read('includes/class-pldr-rights.php');\n", "$rights=$read('includes/class-pldr-rights.php');\n$outbox=$read('includes/class-pldr-r21-outbox.php');\n", 1)
          s=s.replace("$must($rights,'outbox_payload_corrupt','corrupt outbox payloads are not quarantined/dead-lettered.');", "$must($outbox,'outbox_dead_lettered','corrupt outbox payloads are not quarantined/dead-lettered.');")
          s=s.replace("$must($rights,'\\'invalid-payload-json\\'','corrupt outbox payload dead-letter marker missing.');", "$must($outbox,'\\'invalid-payload-json\\'','corrupt outbox payload dead-letter marker missing.');")
          p.write_text(s)
          PY

          find pdf-library-foundation-12 tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find pdf-library-foundation-12/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          php -d zend.assertions=1 -d assert.exception=1 tests/test-crypto.php
          php tests/test-plan-contract.php
          php tests/test-future-24-contract.php
          failed=0
          for test in tests/test-ten-round-review*.php tests/test-twenty-round-review*.php; do
            echo "==> ${test}"
            php "${test}" || failed=1
          done
          test "${failed}" -eq 0
          php tests/test-no-secrets.php
          php tests/test-review-regressions.php
          grep -F "Version: 1.1.0-rc.3" pdf-library-foundation-12/pdf-library-digital-reading.php
          grep -F "define('PLDR_DB_VERSION', '1.1.0')" pdf-library-foundation-12/pdf-library-digital-reading.php
          grep -F "Final defect rounds: 1, 5, 7, 8, 9, 14, 15, 16, 17, 18, 19, 20." docs/TWENTY-ROUND-REVIEW-2026-08-13-R24.md

          # The runner token may not update workflow files. Keep both workflow files unchanged
          # in this runner commit; connector-managed closure updates/removes them afterward.
          git checkout HEAD -- .github/workflows/file-12-quality.yml .github/workflows/r24-apply.yml

          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'R24: complete fresh twenty-round corrective review'
          git push origin HEAD:review/file-12-r24-twenty-round-2026-08-13
