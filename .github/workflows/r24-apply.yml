name: File 12 R24 Apply Reviewed Corrective Batch

on:
  push:
    branches:
      - review/file-12-r24-twenty-round-2026-08-13

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/file-12-r24-twenty-round-2026-08-13
          fetch-depth: 1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply complete R24 post-review corrective batches and verify
        shell: bash
        run: |
          set -euo pipefail
          cat r24-patch/part*.b64 | base64 -d > /tmp/r24_repo_patch.tar.gz
          tar -xzf /tmp/r24_repo_patch.tar.gz -C .
          rm -rf r24-patch
          rm -f .github/workflows/r24-apply.yml
          find pdf-library-foundation-12 tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find pdf-library-foundation-12/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          php -d zend.assertions=1 -d assert.exception=1 tests/test-crypto.php
          php tests/test-plan-contract.php
          php tests/test-future-24-contract.php
          failed=0
          for test in tests/test-ten-round-review*.php tests/test-twenty-round-review*.php; do
            echo "==> ${test}"
            php "${test}" || failed=1
          done
          test "${failed}" -eq 0
          php tests/test-no-secrets.php
          php tests/test-review-regressions.php
          grep -F "Version: 1.1.0-rc.3" pdf-library-foundation-12/pdf-library-digital-reading.php
          grep -F "define('PLDR_DB_VERSION', '1.1.0')" pdf-library-foundation-12/pdf-library-digital-reading.php
          grep -F "Final defect rounds: 1, 5, 7, 8, 9, 14, 15, 16, 17, 18, 19, 20." docs/TWENTY-ROUND-REVIEW-2026-08-13-R24.md
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'R24: complete fresh twenty-round corrective review'
          git push origin HEAD:review/file-12-r24-twenty-round-2026-08-13
