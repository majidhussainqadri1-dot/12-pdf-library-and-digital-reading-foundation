name: R18 Sequential Corrective Review Applier

on:
  push:
    branches:
      - feat/file-12-future-24-v1.1.0-rc1
    paths:
      - .github/workflows/r18-corrective-review-applier.yml

permissions:
  contents: write

jobs:
  apply-r18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/file-12-future-24-v1.1.0-rc1
          fetch-depth: 0
      - name: Freeze and verify R18 source baseline
        run: |
          set -euo pipefail
          git cat-file -e e69ec6bfda55602a284c70c47de81a801d3808c7^{commit}
          if ! git diff --quiet e69ec6bfda55602a284c70c47de81a801d3808c7 -- pdf-library-foundation-12; then
            echo 'Source moved after the frozen R18 baseline; aborting.' >&2
            git diff --stat e69ec6bfda55602a284c70c47de81a801d3808c7 -- pdf-library-foundation-12
            exit 1
          fi
      - name: Configure corrective-review committer
        run: |
          git config user.name 'Sabri File 12 R18 Corrective Review'
          git config user.email 'actions@users.noreply.github.com'
      - name: R18 rounds 1-5
        run: python r18-review-tools/part1.py
      - name: R18 rounds 6-10
        run: python r18-review-tools/part2.py
      - name: R18 rounds 11-15
        run: python r18-review-tools/part3.py
      - name: R18 rounds 16-20
        run: python r18-review-tools/part4.py
      - name: Full source syntax after round 20
        run: |
          set -euo pipefail
          find pdf-library-foundation-12 -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find pdf-library-foundation-12/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Push sequential R18 corrected history
        run: git push origin HEAD:feat/file-12-future-24-v1.1.0-rc1
