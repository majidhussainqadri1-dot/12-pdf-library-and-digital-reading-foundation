name: R23 Round 19 Catalog Scan Budget
on:
  push:
    branches:
      - review/file-12-r23-twenty-round-2026-08-13
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/file-12-r23-twenty-round-2026-08-13
          fetch-depth: 1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Apply complete Round 19 post-review defect batch and retest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pdf-library-foundation-12/includes/class-pldr-reader.php')
          s=p.read_text()
          old="$batch_size=min(200,max(48,$per_page*4));$target=$logical_offset+$per_page+1;$suggested_limit=max(2000,$target*8);$scan_limit_provider_failed=false;"
          new="$batch_size=min(128,max(48,$per_page*3));$target=$logical_offset+$per_page+1;$suggested_limit=max(256,$target*4);$scan_limit_provider_failed=false;"
          if new not in s:
              assert old in s
              s=s.replace(old,new,1)
          old2="$scan_limit=max($batch_size,min(20000,$scan_limit));"
          new2="$scan_limit=max($batch_size,min(1000,$scan_limit));"
          if new2 not in s:
              assert old2 in s
              s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          rm -f .github/workflows/r23-round19-fix.yml
          php -l pdf-library-foundation-12/includes/class-pldr-reader.php
          grep -q "suggested_limit=max(256,\$target\*4)" pdf-library-foundation-12/includes/class-pldr-reader.php
          grep -q "min(1000,\$scan_limit)" pdf-library-foundation-12/includes/class-pldr-reader.php
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'R23 round 19: bound access-filtered catalog scan cost'
          git push origin HEAD:review/file-12-r23-twenty-round-2026-08-13
