name: File 12 Future-24 Quality Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: find pdf-library-foundation-12 tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Authenticated crypto/range/tamper test
        run: php -d zend.assertions=1 -d assert.exception=1 tests/test-crypto.php
      - name: Core governing-plan contract scan
        run: php tests/test-plan-contract.php
      - name: Future Digital Reading Intelligence 24 contract scan
        run: php tests/test-future-24-contract.php
      - name: Full corrective-review regression sweep
        run: |
          failed=0
          for test in tests/test-ten-round-review*.php tests/test-twenty-round-review*.php; do
            echo "==> ${test}"
            php "${test}" || failed=1
          done
          exit "${failed}"
      - name: First fresh ten-round corrective-review regressions
        run: php tests/test-ten-round-review.php
      - name: Second fresh ten-round corrective-review regressions
        run: php tests/test-ten-round-review-r2.php
      - name: Third fresh ten-round corrective-review regressions
        run: php tests/test-ten-round-review-r3.php
      - name: Fourth fresh ten-round corrective-review regressions
        run: php tests/test-ten-round-review-r4.php
      - name: Fifth fresh ten-round corrective-review regressions
        run: php tests/test-ten-round-review-r5.php
      - name: Sixth fresh ten-round corrective-review regressions
        run: php tests/test-ten-round-review-r6.php
      - name: Seventh fresh ten-round corrective-review regressions
        run: php tests/test-ten-round-review-r7.php
      - name: Eighth fresh ten-round corrective-review regressions
        run: php tests/test-ten-round-review-r8.php
      - name: Ninth fresh ten-round corrective-review regressions
        run: php tests/test-ten-round-review-r9.php
      - name: Tenth fresh ten-round corrective-review regressions
        run: php tests/test-ten-round-review-r10.php
      - name: Eleventh fresh ten-round corrective-review regressions
        run: php tests/test-ten-round-review-r11.php
      - name: Twelfth fresh ten-round corrective-review regressions
        run: php tests/test-ten-round-review-r12.php
      - name: Thirteenth fresh twenty-round corrective-review regressions
        run: php tests/test-twenty-round-review-r13.php
      - name: Fourteenth fresh twenty-round corrective-review regressions
        run: php tests/test-twenty-round-review-r14.php
      - name: Fifteenth fresh twenty-round corrective-review regressions
        run: php tests/test-twenty-round-review-r15.php
      - name: Sixteenth fresh twenty-round corrective-review regressions
        run: php tests/test-twenty-round-review-r16.php
      - name: Seventeenth fresh twenty-round corrective-review regressions
        run: php tests/test-twenty-round-review-r17.php
      - name: Eighteenth fresh twenty-round corrective-review regressions
        run: php tests/test-twenty-round-review-r18.php
      - name: Nineteenth fresh twenty-round corrective-review regressions
        run: php tests/test-twenty-round-review-r19.php
      - name: Twentieth fresh twenty-round corrective-review regressions
        run: php tests/test-twenty-round-review-r20.php
      - name: Twenty-first fresh twenty-round corrective-review regressions
        run: php tests/test-twenty-round-review-r21.php
      - name: Secret scan
        run: php tests/test-no-secrets.php
      - name: Independent review regressions
        run: php tests/test-review-regressions.php

  frontend-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax — core and Future-24
        run: find pdf-library-foundation-12/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Exact candidate version markers
        run: |
          grep -F "Version: 1.1.0-rc.1" pdf-library-foundation-12/pdf-library-digital-reading.php
          grep -F "define('PLDR_DB_VERSION', '1.1.0')" pdf-library-foundation-12/pdf-library-digital-reading.php
          grep -F "F12-FUT-024" pdf-library-foundation-12/includes/class-pldr-future.php
      - name: Build deterministic install ZIP and source checksums
        run: |
          rm -rf build dist
          mkdir -p build dist
          LC_ALL=C find pdf-library-foundation-12 -type f -print0 | sort -z | xargs -0 -n1 sha256sum > dist/SOURCE-SHA256SUMS
          cp -a pdf-library-foundation-12 build/
          find build/pdf-library-foundation-12 -exec touch -t 202601010000 {} +
          (cd build && find pdf-library-foundation-12 -type f -print | LC_ALL=C sort | zip -X -q ../dist/12-pdf-library-and-digital-reading-1.1.0-rc.1.zip -@)
          sha256sum dist/12-pdf-library-and-digital-reading-1.1.0-rc.1.zip | tee dist/SHA256SUMS
          unzip -t dist/12-pdf-library-and-digital-reading-1.1.0-rc.1.zip
      - uses: actions/upload-artifact@v4
        with:
          name: file-12-pdf-library-1.1.0-rc.1
          path: dist/
          if-no-files-found: error
