name: File 12 Future-24 Quality Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: find pdf-library-foundation-12 tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Authenticated crypto/range/tamper test
        run: php -d zend.assertions=1 -d assert.exception=1 tests/test-crypto.php
      - name: Core governing-plan contract scan
        run: php tests/test-plan-contract.php
      - name: Future Digital Reading Intelligence 24 contract scan
        run: php tests/test-future-24-contract.php
      - name: Full corrective-review regression sweep
        run: |
          failed=0
          for test in tests/test-ten-round-review*.php tests/test-twenty-round-review*.php; do
            echo "==> ${test}"
            php "${test}" || failed=1
          done
          exit "${failed}"
      - name: First fresh ten-round corrective-review regressions
        run: php tests/test-ten-round-review.php
      - name: Second fresh ten-round corrective-review regressions
        run: php tests/test-ten-round-review-r2.php
      - name: Third fresh ten-round corrective-review regressions
        run: php tests/test-ten-round-review-r3.php
      - name: Fourth fresh ten-round corrective-review regressions
        run: php tests/test-ten-round-review-r4.php
      - name: Fifth fresh ten-round corrective-review regressions
        run: php tests/test-ten-round-review-r5.php
      - name: Sixth fresh ten-round corrective-review regressions
        run: php tests/test-ten-round-review-r6.php
      - name: Seventh fresh ten-round corrective-review regressions
        run: php tests/test-ten-round-review-r7.php
      - name: Eighth fresh ten-round corrective-review regressions
        run: php tests/test-ten-round-review-r8.php
      - name: Ninth fresh ten-round corrective-review regressions
        run: php tests/test-ten-round-review-r9.php
      - name: Tenth fresh ten-round corrective-review regressions
        run: php tests/test-ten-round-review-r10.php
      - name: Eleventh fresh ten-round corrective-review regressions
        run: php tests/test-ten-round-review-r11.php
      - name: Twelfth fresh ten-round corrective-review regressions
