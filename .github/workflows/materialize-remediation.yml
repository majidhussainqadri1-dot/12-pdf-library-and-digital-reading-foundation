name: Materialize File 12 Remediation Source

on:
  push:
    branches:
      - fix/file-12-corrective-remediation

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4

      - name: Verify transfer archive exists
        run: test -f remediation-source.tar.gz

      - name: Verify transfer archive
        run: echo '9f2cff2c63eeffa455f185c39e31c4d8c4f06750f2f0c00deadd82737e165fa5  remediation-source.tar.gz' | sha256sum --check -

      - name: Materialize exact corrective files
        run: |
          tar -xzf remediation-source.tar.gz
          sha256sum --check CHECKSUMS.sha256
          rm remediation-source.tar.gz
          rm .github/workflows/materialize-remediation.yml

      - name: Commit materialized source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize File 12 corrective source'
          git push origin HEAD:${GITHUB_REF_NAME}
