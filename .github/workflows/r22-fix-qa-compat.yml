name: R22 Fix QA Compatibility

on:
  push:
    branches:
      - review/file-12-r22-twenty-round-2026-08-13

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, 'R22 QA compatibility:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/file-12-r22-twenty-round-2026-08-13
          fetch-depth: 1
      - name: Apply compatibility corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('pdf-library-foundation-12/includes/class-pldr-future-rest.php')
          s = p.read_text()
          old = "$grant=PLDR_Access::issue_token($edition_id,(int)$edition['object_id'],'offline',$uid,$grant_ttl);"
          new = "$grant=PLDR_Access::issue_token((int)$edition['id'],(int)$edition['object_id'],'offline',$uid,$grant_ttl);"
          assert s.count(old) == 1, 'offline grant historical marker target drifted'
          p.write_text(s.replace(old,new))

          p = Path('pdf-library-foundation-12/includes/class-pldr-rest.php')
          s = p.read_text()
          old = "if(''!==(string)$wpdb->last_error)return PLDR_Core::machine_error('pldr_delivery_edition_read','Delivery edition state could not be read reliably.',503,array('degraded'=>true));"
          new = "if(''!==(string)$wpdb->last_error){$read_code='download'===$operation?'pldr_download_edition_read':'pldr_delivery_edition_read';return PLDR_Core::machine_error($read_code,'Delivery edition state could not be read reliably.',503,array('degraded'=>true));}"
          assert s.count(old) == 1, 'delivery edition historical marker target drifted'
          p.write_text(s.replace(old,new))

          p = Path('tests/test-twenty-round-review-r22.php')
          s = p.read_text()
          old = "$must($ingest,\"scan_file(\\$cover['tmp_name']\",'cover malware scan missing');"
          new = "$must($ingest,\"$cover_scan=self::scan_file\",'cover malware scan missing');"
          assert s.count(old) == 1, 'R22 cover assertion target drifted'
          p.write_text(s.replace(old,new))
          PY
          rm -f .github/workflows/r22-fix-qa-compat.yml
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'R22: preserve historical QA compatibility after stronger corrections'
          git push origin HEAD:review/file-12-r22-twenty-round-2026-08-13
