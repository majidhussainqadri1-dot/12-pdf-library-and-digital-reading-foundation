name: R23 Round 13 Idempotency Retry Safety
on:
  push:
    branches:
      - review/file-12-r23-twenty-round-2026-08-13
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/file-12-r23-twenty-round-2026-08-13
          fetch-depth: 1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Apply complete Round 13 post-review defect batch and retest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          targets=[
            ('pdf-library-foundation-12/includes/class-pldr-rest.php','pldr_idempotency_abort_after_transient_failed'),
            ('pdf-library-foundation-12/includes/class-pldr-future-rest.php','future_idempotency_abort_after_transient_failed'),
          ]
          for path,audit_code in targets:
              p=Path(path); s=p.read_text()
              needle="""        if(is_wp_error($result)&&in_array($status,array(401,403,404),true)){
          """
              pos=s.find(needle)
              assert pos>=0, path+' denial block missing'
              end=s.find("        $body",pos)
              assert end>pos, path+' body marker missing'
              block=s[pos:end]
              if 'status>=500' not in block.replace(' ',''):
                  insertion="""        if($status>=500){
                      if(!PLDR_Core::idempotency_abort($route,$key,$actor))PLDR_Core::audit('mutation',0,'AUDIT_CODE',array('route'=>$route,'status'=>$status),$actor);
                      if(is_wp_error($result))return $result;
                      return $response;
                  }
          """.replace('AUDIT_CODE',audit_code)
                  s=s[:end]+insertion+s[end:]
              p.write_text(s)
          PY
          rm -f .github/workflows/r23-round13-fix.yml
          php -l pdf-library-foundation-12/includes/class-pldr-rest.php
          php -l pdf-library-foundation-12/includes/class-pldr-future-rest.php
          grep -q "idempotency_abort_after_transient_failed" pdf-library-foundation-12/includes/class-pldr-rest.php
          grep -q "future_idempotency_abort_after_transient_failed" pdf-library-foundation-12/includes/class-pldr-future-rest.php
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'R23 round 13: keep transient mutation failures retry-safe'
          git push origin HEAD:review/file-12-r23-twenty-round-2026-08-13
