name: R17 Corrective Review Patch Applier

on:
  push:
    branches:
      - feat/file-12-future-24-v1.1.0-rc1
    paths:
      - .github/workflows/r17-patch-applier.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/file-12-future-24-v1.1.0-rc1
          fetch-depth: 0
      - name: Decode exact reviewed R17 patch chunks
        run: |
          python - <<'PY'
          import base64, zlib
          from pathlib import Path
          chunks = sorted(Path('r17-chunks').glob('*.txt'))
          if len(chunks) != 4:
              raise SystemExit(f'expected 4 R17 chunks, found {len(chunks)}')
          payload = ''.join(p.read_text() for p in chunks)
          Path('/tmp/r17.patch').write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY
      - name: Apply reviewed R17 corrections
        run: |
          set -euo pipefail
          git apply --check /tmp/r17.patch
          git apply /tmp/r17.patch
          find pdf-library-foundation-12 -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find pdf-library-foundation-12/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          php tests/test-twenty-round-review-r17.php
      - name: Commit exact reviewed R17 source state
        run: |
          set -euo pipefail
          git rm -r r17-chunks
          git add pdf-library-foundation-12 docs tests
          git config user.name 'Sabri File 12 R17 Corrective Review'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Apply File 12 R17 twenty-round corrective review source'
          git push origin HEAD:feat/file-12-future-24-v1.1.0-rc1
